port: $NATS_SERVER_PORT
server_name: "$SERVER_NAME"
pid_file: /home/runner/run/nats.pid
http_port: $NATS_HTTP_PORT

# Pings every 10 s, three unanswered before a connection is closed: a dead link is
# detected in about 30 s instead of NATS's default 2 minutes x 2. After a silent
# partition -- packets dropped, no FIN or RST, which is what a radio or cellular
# outage looks like -- pings are the only thing that tells either side the leaf
# connection is gone, and at the defaults the lab measured 72 s to over 200 s from
# the link returning to a caught-up hub stream. The cost is a
# PING/PONG pair per connection every 10 s: tens of bytes, about 100 KB a day.
ping_interval: "10s"
ping_max: 3

# Operator
operator = $OPERATOR_JWT

# System account
system_account = $SYSTEM_ACCOUNT

jetstream: {
  store_dir: /home/runner/data
  domain: "$JETSTREAM_DOMAIN"
  max_memory_store: $NATS_JS_MAX_MEMORY_STORE
  max_file_store: $NATS_JS_MAX_FILE_STORE
  cipher: chachapoly
  key: "$JETSTREAM_KEY"
  prev_encryption_key: "$JETSTREAM_PREV_KEY"
}

leafnodes: {
  reconnect: "10s"
  remotes: $NATS_LEAF_REMOTES
}

mqtt: {
  port: $NATS_MQTT_PORT
  tls: {
    ca_file: "$NATS_TLS_DIR/$NATS_MQTT_CERT_NAME/ca.crt"
    cert_file: "$NATS_TLS_DIR/$NATS_MQTT_CERT_NAME/tls.crt"
    key_file: "$NATS_TLS_DIR/$NATS_MQTT_CERT_NAME/tls.key"
    handshake_first: true
    timeout: "3s"
  }
}

resolver: {
  type: full
  dir: "$NATS_JWT_DIR"
  allow_delete: false
  interval: "10m"
}
